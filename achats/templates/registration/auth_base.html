<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Connexion{% endblock %} · Achats du jour</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🛒</text></svg>">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Icônes Lucide (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10 font-sans text-slate-900 antialiased">
  <main class="w-full max-w-md">
    <div class="mb-6 text-center">
      <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-indigo-600 text-white shadow-sm">
        <i data-lucide="shopping-cart" class="h-7 w-7"></i>
      </span>
      <h1 class="mt-3 text-xl font-bold">Achats du jour</h1>
      <p class="text-sm text-slate-500">{% block subtitle %}Articles, prix &amp; marquage quotidien{% endblock %}</p>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      {% block content %}{% endblock %}
    </div>

    <p class="mt-5 text-center text-sm text-slate-500">{% block footer %}{% endblock %}</p>
  </main>

  <script>
    if (window.lucide) { try { window.lucide.createIcons(); } catch (e) {} }
  </script>
</body>
</html>
